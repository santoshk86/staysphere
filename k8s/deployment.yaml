apiVersion: apps/v1
kind: Deployment
metadata:
  name: staysphere-api
  namespace: staysphere
  labels:
    app: staysphere-api
    app.kubernetes.io/name: staysphere-api
    app.kubernetes.io/part-of: staysphere
spec:
  # SQLite is file-based with a single writer, and the ReadWriteOnce volume can
  # only be attached to one pod. Exactly one replica; do NOT add an HPA.
  replicas: 1
  strategy:
    # Never run an old and a new pod against the same database file at once.
    type: Recreate
  selector:
    matchLabels:
      app: staysphere-api
  template:
    metadata:
      labels:
        app: staysphere-api
        app.kubernetes.io/name: staysphere-api
        app.kubernetes.io/part-of: staysphere
    spec:
      securityContext:
        # The aspnet:10.0 image runs as uid/gid 1654 ("app"). fsGroup makes the
        # mounted PVC group-owned by 1654 and group-writable so SQLite can create
        # staysphere.db plus its -wal / -shm / lock files.
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: api
          image: staysphere-api:local
          # Local image built into the node / shared daemon; never pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: staysphere-api-config
          volumeMounts:
            - name: data
              mountPath: /app/data
          # No HTTP health endpoint exists in the API yet, so probes use a TCP
          # connect to Kestrel. startupProbe gives the first boot time to run
          # EF Core migrations + seeding before liveness/readiness take over.
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: staysphere-data
